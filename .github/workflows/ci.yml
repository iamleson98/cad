name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC — keeps OS caches warm (7-day eviction)

# Cancel superseded runs on the same ref — rapid pushes never queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Cheapest gate first: formatting is checked in seconds on a dedicated
  # job, and the heavy 3-OS matrix only starts once it is clean.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all --check

  # Full build + lint + test on every push, on all three desktop platforms:
  # Linux (x86_64), Windows (x86_64-msvc), macOS (aarch64). The repo is
  # public so hosted-runner minutes are free.
  build-test:
    name: ${{ matrix.os }} — check + clippy + test
    needs: fmt
    strategy:
      # Report failures from every OS even if one fails first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # rust-cache keys automatically include the runner OS + rustc version,
      # so each platform gets its own cache; shared-key lets PRs/branches
      # reuse the cache seeded by main. Cold first run per OS is ~15-25 min
      # (wgpu + eframe are heavy); warm runs drop to a few minutes.
      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: forgecad-ci

      # Same runner = one shared target/ dir per OS: clippy and tests reuse
      # the artifacts `cargo check` produced instead of recompiling.
      # Fastest-fail-first: check (compiles once) → clippy (incremental) →
      # tests (links + runs).
      - name: Compile check (all targets, locked deps)
        run: cargo check --workspace --all-targets --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (unit + doc)
        run: cargo test --workspace --locked

  # W-10: the wasm32 browser build. Compiles the whole workspace for
  # wasm32-unknown-unknown (zero warnings) and builds the trunk bundle
  # (wasm-bindgen + wasm-opt) that `crates/forge-app/dist` mirrors.
  wasm:
    name: wasm32 — check + clippy + trunk bundle
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + clippy + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: forgecad-ci-wasm

      - name: Compile check (wasm32, locked deps)
        run: cargo check --workspace --locked --target wasm32-unknown-unknown

      - name: Clippy (wasm32, deny warnings)
        run: cargo clippy --workspace --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Install trunk (release binary)
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      - name: Build the browser bundle
        working-directory: crates/forge-app
        # trunk 0.21 rejects a set NO_COLOR (GitHub runners export
        # NO_COLOR=1): it derives --no-color with no value and the arg
        # parser fails. `env -u` actually UNSETS it — an empty string
        # is still "set" and trips the same bug (verified locally).
        run: env -u NO_COLOR trunk build --release

  # E2E: the intensive browser suite — headless Chromium drives the REAL
  # wasm app (trunk DEBUG bundle: the E2E bridge is compiled into debug
  # builds via debug_assertions) through every button, menu and feature,
  # asserting state changes, downloads, imports and absence of panics.
  # The same flows run natively in cargo test (forge-app ui_tests), so
  # logic bugs surface in seconds on every OS; this job adds the real
  # browser: wasm + WebGL2 (SwiftShader) + the JS bridge.
  e2e:
    name: e2e — browser suite (headless Chromium)
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Own cache lineage: debug-profile wasm artifacts (the release
          # bundle artifacts of the `wasm` job fingerprint differently).
          shared-key: forgecad-ci-e2e

      - name: Install trunk (release binary)
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.cargo/bin"
          trunk --version

      # DEBUG bundle on purpose: no wasm-opt/opt passes (much faster
      # compile) and the E2E bridge is active (debug_assertions).
      - name: Build the debug browser bundle
        working-directory: crates/forge-app
        run: env -u NO_COLOR trunk build

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install e2e dependencies + browser
        working-directory: e2e
        run: |
          npm ci
          # Browser binaries come from the cache; the system libraries
          # still need apt (fast, ~30 s).
          npx playwright install --with-deps chromium

      - name: Run the browser E2E suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload test artifacts (screenshots, traces, report)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e/test-results/
          retention-days: 7
