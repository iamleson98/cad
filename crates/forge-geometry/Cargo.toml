[package]
name = "forge-geometry"
description = "Computational geometry engine: mesh kernel, primitives, sweeps, CSG booleans, BVH raycasting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
forge-core = { workspace = true }
nalgebra = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

# Parallelism is native-only: wasm32 has no threads, so the parallel
# sites in `mesh.rs` fall back to serial iterators via `#[cfg]`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
approx = "0.5"
